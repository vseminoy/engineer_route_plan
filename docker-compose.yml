# Demo stand: `cp .env.example .env && docker compose up`.
# UI and API are served at http://localhost:${FRONTEND_PORT}.

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      TZ: ${TZ:-Europe/Moscow}
    ports:
      # Loopback only: for a database client on this machine, not for the network.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: builds an MLD graph per profile from the repository's road extract into
  # `car/`, `foot/` and `bike/` of the volume. Skips a profile whose graph was built from a
  # file with the same checksum, so replacing the extract rebuilds all three on the next `up`.
  osrm-prepare:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    volumes:
      - osrm-data:/data
      - ./osrm:/src:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        cd /data
        # One copy for all three profiles, hashed before any graph is removed: a missing
        # extract stops the service here and the built graphs stay in place.
        rm -f region.osm.pbf
        cp /src/moscow-oblast.osm.pbf region.osm.pbf
        sum="$$(sha256sum region.osm.pbf)"
        sum="$${sum%% *}"
        for profile in car foot bike; do
          if [ -f "$$profile/ready" ] && [ "$$(cat "$$profile/ready")" = "$$sum" ]; then
            echo "osrm-prepare: $$profile graph is up to date"
            continue
          fi
          case "$$profile" in
            bike) lua=/opt/bicycle.lua ;;
            *) lua="/opt/$$profile.lua" ;;
          esac
          rm -rf "$$profile"
          mkdir "$$profile"
          # osrm-extract writes the graph next to its input; a hard link puts it in the
          # profile's directory without copying the extract again.
          ln region.osm.pbf "$$profile/region.osm.pbf"
          echo "osrm-prepare: $$profile: extracting"
          osrm-extract -p "$$lua" "$$profile/region.osm.pbf"
          rm "$$profile/region.osm.pbf"
          echo "osrm-prepare: $$profile: partitioning"
          osrm-partition "$$profile/region.osrm"
          echo "osrm-prepare: $$profile: customizing"
          osrm-customize "$$profile/region.osrm"
          echo "$$sum" > "$$profile/ready"
        done
        rm region.osm.pbf
        echo "osrm-prepare: done"

  # One `osrm-routed` per profile: a server answers only for the graph it loaded. The
  # table limit is raised from the default 100 points: a region's day has more tickets
  # and brigades than that. The backend reads the same OSRM_MAX_TABLE_SIZE to split larger
  # tables into strips.
  osrm-car: &osrm
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "${OSRM_MAX_TABLE_SIZE:-1000}", "/data/car/region.osrm"]
    volumes:
      - osrm-data:/data
    depends_on:
      # `restart`: a rebuilt graph is only picked up by a restarted osrm-routed.
      osrm-prepare:
        condition: service_completed_successfully
        restart: true

  osrm-foot:
    <<: *osrm
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "${OSRM_MAX_TABLE_SIZE:-1000}", "/data/foot/region.osrm"]

  osrm-bike:
    <<: *osrm
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "${OSRM_MAX_TABLE_SIZE:-1000}", "/data/bike/region.osrm"]

  # One-shot: brings the schema to the latest revision, then exits. It alone holds the
  # schema owner's credentials and the role passwords, which the migration sets on the
  # `app_rw` and `app_ro` roles it creates.
  migrate:
    build: ./back
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_RW_PASSWORD: ${APP_RW_PASSWORD:?set in .env}
      APP_RO_PASSWORD: ${APP_RO_PASSWORD:?set in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
      TZ: ${TZ:-Europe/Moscow}
    depends_on:
      db:
        condition: service_healthy

  # Starts without waiting for OSRM: the graphs may take a long time to build, and
  # the backend opens its OSRM clients lazily. Connects as `app_rw`, which may change
  # data but not the schema.
  backend:
    build: ./back
    environment:
      DATABASE_URL: postgresql://app_rw:${APP_RW_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB}
      OSRM_URL_CAR: http://osrm-car:5000
      OSRM_URL_FOOT: http://osrm-foot:5000
      OSRM_URL_BIKE: http://osrm-bike:5000
      PUBLIC_TRANSPORT_FACTOR: ${PUBLIC_TRANSPORT_FACTOR:-1.5}
      OSRM_MAX_TABLE_SIZE: ${OSRM_MAX_TABLE_SIZE:-1000}
      OSRM_TIMEOUT_S: ${OSRM_TIMEOUT_S:-60}
      SOLVER_TIME_LIMIT_S: ${SOLVER_TIME_LIMIT_S:-30}
      SOLVER_WATCHDOG_MARGIN_S: ${SOLVER_WATCHDOG_MARGIN_S:-15}
      APP_MODE: ${APP_MODE:-demo}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:?set in .env}
      NOMINATIM_URL: ${NOMINATIM_URL-}
      # Local time of the region: the app stores and serves naive local datetimes, so
      # the process clock must be in the region's zone, not UTC.
      TZ: ${TZ:-Europe/Moscow}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8001}:8001"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build: ./front
    environment:
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:?set in .env}
    ports:
      # Loopback by default: the API has no authentication, so exposing the stand to
      # the network is an explicit choice via FRONTEND_BIND.
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    depends_on:
      # `restart`: nginx resolves `backend` once at startup.
      backend:
        condition: service_healthy
        restart: true

volumes:
  db-data:
  osrm-data:
