[project]
name = "engineer-route-plan-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "httpx>=0.27,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "structlog>=25.5,<27",
    "alembic>=1.13,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "schemathesis>=3.34,<4",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "datamodel-code-generator>=0.82,<0.83",
    "testcontainers[postgres]>=4.8,<5",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring external services (PostgreSQL, OSRM)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Datetimes are naive local time of the region throughout the stack, never UTC.
ignore = ["DTZ001"]

[tool.ruff.lint.isort]
# `alembic/` here holds the migration scripts; the name is the third-party package.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
