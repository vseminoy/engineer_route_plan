server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # The same variable configures the backend's limit; an oversized body is rejected
    # here and never reaches the backend.
    client_max_body_size ${MAX_REQUEST_BODY_BYTES};
    error_page 413 500 502 503 504 /empty-error;

    proxy_set_header Host $host;
    # The peer address only: a client-supplied X-Forwarded-For is not passed on.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://backend:8001;
    }

    location = /health {
        proxy_pass http://backend:8001;
    }

    # Client-side routes of the SPA resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error responses other than 400 carry no body; the client builds its text from
    # the status. `return` with empty text still renders nginx's HTML page, so an
    # empty file is served instead.
    location = /empty-error {
        internal;
        root /usr/share/nginx/errors;
        try_files /empty =500;
    }
}
