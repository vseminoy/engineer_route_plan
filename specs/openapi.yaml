openapi: 3.1.0
info:
  title: Engineer Route Plan API
  version: 0.1.0
paths:
  /health:
    get:
      operationId: get_health
      summary: Liveness-проверка процесса backend
      description: >-
        Возвращает 200, если процесс FastAPI запущен и отвечает на запросы.
        Проверяет только сам процесс (liveness) — доступность PostgreSQL и
        OSRM эндпоинт не опрашивает; их наличие для демо-стенда проверяется
        отдельно на уровне Docker Compose (healthcheck каждого сервиса).
        Без аутентификации, как и весь backend.
      responses:
        "200":
          description: Процесс работает и отвечает на запросы
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "500":
          $ref: "./common.yaml#/components/responses/InternalError"

  /api/v1/regions:
    get:
      operationId: list_regions
      summary: Регионы, для которых можно загрузить данные и построить план
      description: >-
        Регионы из конфигурации сервера в порядке её записи, независимо от того,
        загружены ли по ним данные. Регион — отдельный сценарий планирования:
        один файл заявок, свои бригады, заявки и бригады разных регионов вместе
        не планируются. Список — справочник для остальных операций, которые
        принимают код региона.
      responses:
        "200":
          description: Все регионы конфигурации
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Region"
        "500":
          $ref: "./common.yaml#/components/responses/InternalError"

  /api/v1/data/upload:
    post:
      operationId: upload_region_data
      summary: Загрузить файл заявок региона
      description: >-
        Заменяет заявки региона заявками файла в одной транзакции. Все заявки
        файла относятся к выбранному региону. Бригады региона — демо-бригады,
        их создаёт сервер: при первой загрузке региона они создаются, при
        следующих сохраняются с теми же id, пока состав бригад в конфигурации
        региона не меняется, и у них обновляются только точки старта — офис из
        служебной строки файла, бригады удалённых городов по районам заявок.
        Планы региона и события перепланирования удаляются: они ссылаются на
        прежние заявки. При любой ошибке данные региона не меняются.


        Файл — CSV или JSON, формат определяется по расширению имени файла
        (.csv или .json, регистр не важен). CSV: разделитель «;», первая строка —
        заголовок, кодировка UTF-8 или Windows-1251, с BOM или без. JSON: массив
        объектов с ключами как у заголовков CSV, только UTF-8. Обязательные
        колонки: «Заявка», «Тип заявки HD», «Начало», «Окончание», «Адрес»;
        необязательные: «Тип заявки BK», «Район», «Статус BK», остальные
        игнорируются. Не больше 500 заявок (пустые строки и служебная строка не
        в счёт) и 50 колонок. Предел размера всего запроса — 1 048 576 байт
        (1 МБ); больше — ответ 413.


        Пустые строки и служебная строка адреса офиса («Адрес Офиса» /
        «Адрес офиса» в колонке «Заявка») не заявки: они пропускаются и
        учитываются в rows_skipped. Строка-заявка с ошибкой не загружается и
        не прерывает загрузку остальных — она возвращается в rows_invalid с
        номером и причиной. Файл, в котором не осталось ни одной заявки, —
        ошибка 400.


        Координаты адресов берутся из гео-кэша сервера; промахи кэша, если
        включён внешний геокодер, ищутся в нём не больше 50 адресов за загрузку
        и не чаще запроса в секунду — такая загрузка длится несколько минут.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/RegionDataUpload"
      responses:
        "200":
          description: Данные региона заменены данными файла
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataLoadResult"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "413":
          $ref: "./common.yaml#/components/responses/PayloadTooLarge"
        "500":
          $ref: "./common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"
          description: >-
            Недоступна база данных или включённый внешний геокодер. Данные
            региона не изменились.


  /api/v1/data/demo:
    post:
      operationId: load_demo_data
      summary: Загрузить встроенный демо-набор региона
      description: >-
        То же, что загрузка файла, но заявки берутся из демо-набора региона,
        встроенного в сервер: заявки региона заменяются в одной транзакции,
        бригады сохраняются (обновляются точки старта), планы региона
        удаляются. Демо-набор загружается без доступа к интернету. Регион —
        в теле запроса.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoDataRequest"
      responses:
        "200":
          description: Данные региона заменены демо-набором
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataLoadResult"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "413":
          $ref: "./common.yaml#/components/responses/PayloadTooLarge"
        "500":
          $ref: "./common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"
          description: Недоступна база данных. Данные региона не изменились.

  /api/v1/engineers:
    get:
      operationId: list_engineers
      summary: Бригады региона
      description: >-
        Бригады только выбранного региона, по возрастанию id. id бригады не
        меняется при повторной загрузке данных региона. Регион без загруженных
        данных — пустой список.
      parameters:
        - $ref: "#/components/parameters/RegionQuery"
      responses:
        "200":
          description: Бригады региона
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Engineer"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "500":
          $ref: "./common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"
          description: Недоступна база данных.

  /api/v1/tickets:
    get:
      operationId: list_tickets
      summary: Заявки региона
      description: >-
        Все заявки только выбранного региона, в любом статусе, по возрастанию
        id, без постраничной выдачи: в регионе не больше 500 заявок — предел
        загружаемого файла. Регион без загруженных данных — пустой список.
        Назначения заявок бригадам — в плане, а не здесь.
      parameters:
        - $ref: "#/components/parameters/RegionQuery"
      responses:
        "200":
          description: Заявки региона
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "500":
          $ref: "./common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"
          description: Недоступна база данных.

  /api/v1/tickets/{ticket_id}/status:
    patch:
      operationId: change_ticket_status
      summary: Изменить статус заявки
      description: >-
        Диспетчер отмечает ход заявки по сообщению бригады. Статусы идут по
        цепочке not_sent → sent → en_route → in_progress → completed; переход
        вперёд по цепочке допустим и через шаг (из sent сразу в completed).
        cancelled — из любого незакрытого статуса. overdue — из not_sent, sent
        и en_route; из overdue — в en_route, in_progress, completed или
        cancelled. completed и cancelled — закрытые статусы: из них переходов
        нет, и закрытая заявка не участвует в последующих перепланированиях.
        Любой другой переход, в том числе назад по цепочке, — ошибка 400 с
        message; статус заявки при этом не меняется. Запрос со статусом,
        который у заявки уже есть, ничего не меняет и отвечает 200 — повтор
        запроса безопасен. Отмена после выезда бригады (из en_route или
        in_progress) отмечается у заявки: выезд уже потрачен и учитывается в
        метриках плана. Уже построенные планы запрос не меняет.
      parameters:
        - name: ticket_id
          in: path
          required: true
          description: Идентификатор заявки на сервере
          schema:
            type: integer
            minimum: 1
            maximum: 9223372036854775807
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketStatusChange"
      responses:
        "200":
          description: Заявка с новым статусом
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
          description: Заявки с таким ticket_id нет.
        "413":
          $ref: "./common.yaml#/components/responses/PayloadTooLarge"
        "500":
          $ref: "./common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"
          description: Недоступна база данных. Статус заявки не изменился.

  /api/v1/plan/build:
    post:
      operationId: build_plan
      summary: Построить план выездов региона на дату
      description: >-
        Строит план: назначает открытые (не completed и не cancelled) заявки
        региона на дату plan_date бригадам региона — основным алгоритмом
        (RoutingModel, трёхфазная лексикографическая оптимизация) или
        независимым baseline (FCFS, для сравнения), — и сохраняет план в БД.
        Каждый вызов — новый план (новый plan_id); построение не заменяет и не
        удаляет более ранние планы того же региона и даты.


        Регион должен иметь загруженные данные (`POST /data/upload` или
        `POST /data/demo`) — иначе 400. Каждая открытая заявка региона должна
        приходиться на дату plan_date (окно заявки — из файла одной загрузки,
        все заявки на один день) — несовпадение хотя бы одной заявки отклоняет
        весь запрос 400, план не строится.


        Время в пути и расстояние — по дорожному графу (OSRM), отдельно для
        каждого типа транспорта бригад региона; матрица считается заново на
        каждый вызов. Запрос идёт под общим дедлайном (обращения к OSRM и сам
        солвер вместе) — при превышении ответ 503, план не сохраняется. Основной
        алгоритм выполняется в одном процессе на весь сервер: конкурентный
        вызов дожидается своей очереди в пределах того же дедлайна.


        Плановое прибытие — расчётное время в пути от предыдущей точки
        маршрута (или от точки старта бригады) плюс текущее время; норматив
        «дорога 20 минут» здесь не используется. Причина каждой неназначенной
        заявки определяется процедурой атрибуции (навык → транспорт →
        окно/смена → «все подходящие бригады заняты»), а не первой
        проваленной проверкой.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanBuildRequest"
      responses:
        "201":
          description: План построен и сохранён
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
          description: >-
            Регион не из конфигурации, у региона нет загруженных данных, окно
            хотя бы одной открытой заявки региона не на дату plan_date, либо
            число точек маршрутной матрицы больше предела OSRM.
        "413":
          $ref: "./common.yaml#/components/responses/PayloadTooLarge"
        "500":
          $ref: "./common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"
          description: >-
            Недоступна база данных или сервис маршрутов OSRM, либо построение
            не уложилось в общий дедлайн запроса. План не сохранён.

  /api/v1/plan/{plan_id}:
    get:
      operationId: get_plan
      summary: Получить ранее построенный план
      description: >-
        Возвращает сохранённый план в том же формате, что и ответ
        build_plan, без повторного обращения к OSRM или солверу: маршруты,
        объяснения и причины неназначенных заявок читаются из сохранённых
        данных построения.
      parameters:
        - name: plan_id
          in: path
          required: true
          description: Идентификатор плана на сервере
          schema:
            type: integer
            minimum: 1
            maximum: 9223372036854775807
      responses:
        "200":
          description: Сохранённый план
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
          description: Плана с таким plan_id нет.
        "500":
          $ref: "./common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"
          description: Недоступна база данных.
components:
  parameters:
    RegionQuery:
      name: region
      in: query
      required: true
      description: >-
        Код региона из списка регионов. Код, которого нет в конфигурации
        сервера, — ошибка 400 у параметра region.
      schema:
        $ref: "#/components/schemas/RegionCode"
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
          description: Статус процесса; поле присутствует со значением "ok" в любом полученном ответе
        version:
          type: string
          description: Версия приложения из метаданных пакета (совпадает с info.version)

    RegionCode:
      type: string
      minLength: 1
      maxLength: 50
      pattern: "^[a-z][a-z0-9_]*$"
      description: Код региона — латиница в нижнем регистре, цифры и «_»; начинается с буквы
      examples: ["east"]

    Region:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          $ref: "#/components/schemas/RegionCode"
        name:
          type: string
          description: Название региона для показа пользователю

    Point:
      type: object
      additionalProperties: false
      required: [lat, lon]
      description: Точка WGS84 (EPSG:4326), градусы
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
          description: Широта, градусы
        lon:
          type: number
          minimum: -180
          maximum: 180
          description: Долгота, градусы

    Skill:
      type: string
      enum: [local_work, connection, emergency]
      description: >-
        Навык: local_work — локальные работы, connection — подключения и
        дозаказы, emergency — аварийные работы

    VehicleType:
      type: string
      enum: [car, foot, bike, public_transport]
      description: Транспорт бригады — определяет профиль маршрута по дорожному графу

    TicketStatus:
      type: string
      enum: [not_sent, sent, en_route, in_progress, completed, cancelled, overdue]
      description: Статус заявки

    Engineer:
      type: object
      additionalProperties: false
      required: [id, name, vehicle_type, skills, shift_start, shift_end, start]
      properties:
        id:
          type: integer
          description: Идентификатор бригады
        name:
          type: string
          description: Название бригады
        vehicle_type:
          $ref: "#/components/schemas/VehicleType"
        skills:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Skill"
          description: Навыки бригады, от одного до трёх
        shift_start:
          $ref: "./common.yaml#/components/schemas/LocalTime"
        shift_end:
          $ref: "./common.yaml#/components/schemas/LocalTime"
        start:
          $ref: "#/components/schemas/Point"

    Ticket:
      type: object
      additionalProperties: false
      required:
        - id
        - external_id
        - type_bk
        - type_hd
        - required_skill
        - required_vehicle
        - priority
        - district
        - address
        - location
        - window_start
        - window_end
        - duration_min
        - status
        - received_at
      properties:
        id:
          type: integer
          description: Идентификатор заявки на сервере
        external_id:
          type: string
          description: Номер заявки из файла (колонка «Заявка»); не уникален
        type_bk:
          type: [string, "null"]
          description: Тип заявки BK из файла; null, если колонки или значения нет
        type_hd:
          type: string
          description: Тип заявки HD из файла
        required_skill:
          $ref: "#/components/schemas/Skill"
        required_vehicle:
          description: Транспорт, который требует заявка; null — подходит любой
          anyOf:
            - $ref: "#/components/schemas/VehicleType"
            - type: "null"
        priority:
          type: integer
          minimum: 1
          description: >-
            Ранг приоритета, меньше — срочнее: 1 — авария, 2 — подключение,
            3 — ремонт и дозаказ
        district:
          type: [string, "null"]
          description: Район из файла; null, если не указан
        address:
          type: string
          description: Адрес из файла
        location:
          $ref: "#/components/schemas/Point"
        window_start:
          $ref: "./common.yaml#/components/schemas/LocalDateTime"
        window_end:
          $ref: "./common.yaml#/components/schemas/LocalDateTime"
        duration_min:
          type: integer
          minimum: 1
          description: Время работы на объекте, минуты
        status:
          $ref: "#/components/schemas/TicketStatus"
        received_at:
          $ref: "./common.yaml#/components/schemas/LocalDateTime"

    TicketStatusChange:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/TicketStatus"
          description: >-
            Новый статус заявки; допустимые переходы — в описании операции
            change_ticket_status

    DemoDataRequest:
      type: object
      additionalProperties: false
      required: [region]
      properties:
        region:
          $ref: "#/components/schemas/RegionCode"

    RegionDataUpload:
      type: object
      additionalProperties: false
      required: [region, tickets_file]
      properties:
        region:
          $ref: "#/components/schemas/RegionCode"
        tickets_file:
          type: string
          format: binary
          description: >-
            Файл заявок, .csv или .json; формат и пределы — в описании операции

    InvalidRow:
      type: object
      additionalProperties: false
      required: [row, reason, column]
      properties:
        row:
          type: integer
          minimum: 1
          description: >-
            Номер строки: для CSV — строка файла (заголовок — строка 1), для
            JSON — позиция элемента массива, с 1
        reason:
          type: string
          enum:
            - missing_field
            - field_too_long
            - bad_datetime
            - window_order
            - unknown_type
            - unknown_status
            - address_not_found
          description: >-
            Почему строка не загружена: missing_field — нет обязательного поля;
            field_too_long — поле длиннее предела (адрес — 300 символов,
            остальные — 200); bad_datetime — время не в формате ДД.ММ.ГГГГ Ч:ММ;
            window_order — начало окна не раньше окончания; unknown_type — тип
            заявки не из таблицы соответствия; unknown_status — «Статус BK» не
            из таблицы соответствия; address_not_found — для адреса не нашлось
            координат
        column:
          type: [string, "null"]
          description: >-
            Колонка файла, к которой относится ошибка, как в заголовке; null,
            если ошибка не относится к одной колонке

    DataLoadResult:
      type: object
      additionalProperties: false
      required: [region, engineers, tickets, rows_total, rows_skipped, rows_invalid]
      properties:
        region:
          $ref: "#/components/schemas/RegionCode"
        engineers:
          type: integer
          minimum: 0
          description: Сколько бригад теперь у региона
        tickets:
          type: integer
          minimum: 1
          description: Сколько заявок загружено
        rows_total:
          type: integer
          minimum: 0
          description: Строк данных в файле, без заголовка CSV
        rows_skipped:
          type: integer
          minimum: 0
          description: Пропущено строк, которые не заявки — пустых и служебной строки адреса офиса
        rows_invalid:
          type: array
          items:
            $ref: "#/components/schemas/InvalidRow"
          description: Строки-заявки, которые не загружены, по возрастанию номера строки

    PlanAlgorithm:
      type: string
      enum: [or_tools, baseline_fcfs]
      description: >-
        Чем строится план: or_tools — основной алгоритм (RoutingModel,
        трёхфазная лексикографическая оптимизация), baseline_fcfs — независимый
        план для сравнения (назначение по порядку поступления заявок)

    PlanBuildRequest:
      type: object
      additionalProperties: false
      required: [region, plan_date, algorithm]
      properties:
        region:
          $ref: "#/components/schemas/RegionCode"
        plan_date:
          $ref: "./common.yaml#/components/schemas/LocalDate"
          description: >-
            Дата плана; окно каждой открытой заявки региона должно приходиться
            на эту дату
        algorithm:
          $ref: "#/components/schemas/PlanAlgorithm"

    UnassignedReason:
      type: string
      enum:
        - no_skill
        - no_vehicle
        - no_time_slot
        - shift_overflow
        - all_eligible_engineers_booked_elsewhere
      description: >-
        Причина, по которой заявка не назначена ни одной бригаде: no_skill —
        нет бригады с нужным навыком; no_vehicle — нет бригады с нужным
        транспортом; no_time_slot — ни одна подходящая по навыку и транспорту
        бригада не успевает в окно заявки без нарушения своих ограничений;
        shift_overflow — назначение вывело бы бригаду за пределы смены;
        all_eligible_engineers_booked_elsewhere — подходящая бригада есть, но
        все такие бригады заняты другими заявками

    Visit:
      type: object
      additionalProperties: false
      required:
        - ticket_id
        - sequence_no
        - planned_arrival
        - travel_time_min
        - travel_distance_km
        - explanation
      properties:
        ticket_id:
          type: integer
          description: Заявка визита
        sequence_no:
          type: integer
          minimum: 1
          description: Порядковый номер визита в маршруте бригады, с 1
        planned_arrival:
          $ref: "./common.yaml#/components/schemas/LocalDateTime"
          description: >-
            Плановое прибытие; может быть раньше начала окна заявки — бригада
            ждёт открытия окна
        travel_time_min:
          type: integer
          minimum: 0
          description: >-
            Время в пути до визита от предыдущей точки маршрута (или от точки
            старта бригады для первого визита), минуты, с округлением вверх
        travel_distance_km:
          type: number
          minimum: 0
          description: >-
            Расстояние до визита от предыдущей точки маршрута, километры, с
            округлением до 0.1 км
        explanation:
          type: string
          description: Текст для пользователя, почему заявка назначена этой бригаде

    EngineerRoute:
      type: object
      additionalProperties: false
      required:
        - engineer_id
        - name
        - route
        - total_distance_km
        - total_travel_time_min
        - idle_time_min
      properties:
        engineer_id:
          type: integer
          description: Бригада маршрута
        name:
          type: string
          description: Название бригады
        route:
          type: array
          items:
            $ref: "#/components/schemas/Visit"
          description: Визиты бригады по возрастанию sequence_no; пустой массив — бригада не задействована
        total_distance_km:
          type: number
          minimum: 0
          description: Суммарное расстояние маршрута, километры
        total_travel_time_min:
          type: integer
          minimum: 0
          description: Суммарное время в пути маршрута, минуты
        idle_time_min:
          type: integer
          minimum: 0
          description: >-
            Простой бригады: длина смены минус суммарное время визитов и
            переездов; только для отображения — не входит в целевую функцию
            построения плана

    UnassignedTicket:
      type: object
      additionalProperties: false
      required: [ticket_id, reason_code, explanation]
      properties:
        ticket_id:
          type: integer
          description: Неназначенная заявка
        reason_code:
          $ref: "#/components/schemas/UnassignedReason"
        explanation:
          type: string
          description: Текст для пользователя, почему заявка не назначена

    Plan:
      type: object
      additionalProperties: false
      required: [plan_id, algorithm, engineers, unassigned]
      properties:
        plan_id:
          type: integer
          description: Идентификатор плана на сервере
        algorithm:
          $ref: "#/components/schemas/PlanAlgorithm"
        engineers:
          type: array
          items:
            $ref: "#/components/schemas/EngineerRoute"
          description: Маршруты всех бригад региона на дату плана, по возрастанию engineer_id
        unassigned:
          type: array
          items:
            $ref: "#/components/schemas/UnassignedTicket"
          description: Неназначенные заявки, по возрастанию ticket_id
