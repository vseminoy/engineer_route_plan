openapi: 3.1.0
info:
  title: Engineer Route Plan API
  version: 0.1.0
paths:
  /health:
    get:
      operationId: get_health
      summary: Liveness-проверка процесса backend
      description: >-
        Возвращает 200, если процесс FastAPI запущен и отвечает на запросы.
        Проверяет только сам процесс (liveness) — доступность PostgreSQL и
        OSRM эндпоинт не опрашивает; их наличие для демо-стенда проверяется
        отдельно на уровне Docker Compose (healthcheck каждого сервиса).
        Без аутентификации, как и весь backend.
      responses:
        "200":
          description: Процесс работает и отвечает на запросы
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "500":
          $ref: "./common.yaml#/components/responses/InternalError"

  /api/v1/regions:
    get:
      operationId: list_regions
      summary: Регионы, для которых можно загрузить данные и построить план
      description: >-
        Регионы из конфигурации сервера в порядке её записи, независимо от того,
        загружены ли по ним данные. Регион — отдельный сценарий планирования:
        один файл заявок, свои бригады, заявки и бригады разных регионов вместе
        не планируются. Список — справочник для остальных операций, которые
        принимают код региона.
      responses:
        "200":
          description: Все регионы конфигурации
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Region"
        "500":
          $ref: "./common.yaml#/components/responses/InternalError"

  /api/v1/data/upload:
    post:
      operationId: upload_region_data
      summary: Загрузить файл заявок региона
      description: >-
        Заменяет заявки региона заявками файла в одной транзакции. Все заявки
        файла относятся к выбранному региону. Бригады региона — демо-бригады,
        их создаёт сервер: при первой загрузке региона они создаются, при
        следующих сохраняются с теми же id, пока состав бригад в конфигурации
        региона не меняется, и у них обновляются только точки старта — офис из
        служебной строки файла, бригады удалённых городов по районам заявок.
        Планы региона и события перепланирования удаляются: они ссылаются на
        прежние заявки. При любой ошибке данные региона не меняются.


        Файл — CSV или JSON, формат определяется по расширению имени файла
        (.csv или .json, регистр не важен). CSV: разделитель «;», первая строка —
        заголовок, кодировка UTF-8 или Windows-1251, с BOM или без. JSON: массив
        объектов с ключами как у заголовков CSV, только UTF-8. Обязательные
        колонки: «Заявка», «Тип заявки HD», «Начало», «Окончание», «Адрес»;
        необязательные: «Тип заявки BK», «Район», «Статус BK», остальные
        игнорируются. Не больше 500 заявок (пустые строки и служебная строка не
        в счёт) и 50 колонок. Предел размера всего запроса — 1 048 576 байт
        (1 МБ); больше — ответ 413.


        Пустые строки и служебная строка адреса офиса («Адрес Офиса» /
        «Адрес офиса» в колонке «Заявка») не заявки: они пропускаются и
        учитываются в rows_skipped. Строка-заявка с ошибкой не загружается и
        не прерывает загрузку остальных — она возвращается в rows_invalid с
        номером и причиной. Файл, в котором не осталось ни одной заявки, —
        ошибка 400.


        Координаты адресов берутся из гео-кэша сервера; промахи кэша, если
        включён внешний геокодер, ищутся в нём не больше 50 адресов за загрузку
        и не чаще запроса в секунду — такая загрузка длится несколько минут.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/RegionDataUpload"
      responses:
        "200":
          description: Данные региона заменены данными файла
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataLoadResult"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "413":
          $ref: "./common.yaml#/components/responses/PayloadTooLarge"
        "500":
          $ref: "./common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"
          description: >-
            Недоступна база данных или включённый внешний геокодер. Данные
            региона не изменились.


  /api/v1/data/demo:
    post:
      operationId: load_demo_data
      summary: Загрузить встроенный демо-набор региона
      description: >-
        То же, что загрузка файла, но заявки берутся из демо-набора региона,
        встроенного в сервер: заявки региона заменяются в одной транзакции,
        бригады сохраняются (обновляются точки старта), планы региона
        удаляются. Демо-набор загружается без доступа к интернету. Регион —
        в теле запроса.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoDataRequest"
      responses:
        "200":
          description: Данные региона заменены демо-набором
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataLoadResult"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "413":
          $ref: "./common.yaml#/components/responses/PayloadTooLarge"
        "500":
          $ref: "./common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"
          description: Недоступна база данных. Данные региона не изменились.

  /api/v1/engineer-sets:
    get:
      operationId: list_engineer_sets
      summary: Наборы бригад региона
      description: >-
        Все наборы бригад выбранного региона: набор `default` (создаётся
        первой загрузкой данных региона, его нельзя удалить) и, если созданы,
        дополнительные наборы. Регион без загруженных данных — пустой список.
      parameters:
        - $ref: "#/components/parameters/RegionQuery"
      responses:
        "200":
          description: Наборы бригад региона
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EngineerSet"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
          description: region не из конфигурации или не передан.
        "500":
          $ref: "./common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"
          description: Недоступна база данных.
    post:
      operationId: create_engineer_set
      summary: Создать дополнительный набор бригад региона
      description: >-
        Создаёт набор тем же генератором, что и набор `default`, со своими
        параметрами (`engineers`, `morning_share`, `evening_share`, `seed`):
        бригад на весь день (их не меньше 4) вместе — все навыки и все виды
        транспорта, у каждой бригады 1–3 навыка, смены — в пределах суток.
        Регион должен иметь загруженные данные — иначе 400. План и baseline
        по набору строятся отдельным запросом `POST /plan/build` с этим
        `engineer_set_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EngineerSetCreateRequest"
      responses:
        "201":
          description: Набор создан
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineerSet"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
          description: >-
            Регион не из конфигурации или не загружен (`fields`), параметр
            набора вне предела (`fields`), либо бригад на весь день после
            разбивки по долям смен получилось бы меньше 4 (`message`).
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
          description: В регионе уже есть набор с таким name.
        "500":
          $ref: "./common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"
          description: Недоступна база данных. Набор не создан.

  /api/v1/engineer-sets/{engineer_set_id}:
    delete:
      operationId: delete_engineer_set
      summary: Удалить дополнительный набор бригад вместе с его планами
      description: >-
        Удаляет набор, его бригады, его планы (в т.ч. baseline) и их визиты и
        события перепланирования, в одной транзакции. Набор `default`
        удалить нельзя — 409: у региона всегда должен быть хотя бы один набор.
      parameters:
        - name: engineer_set_id
          in: path
          required: true
          description: Идентификатор набора бригад на сервере
          schema:
            type: integer
            minimum: 1
            maximum: 9223372036854775807
      responses:
        "204":
          description: Набор, его бригады и его планы удалены
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/X-Request-ID"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
          description: Набора с таким engineer_set_id нет.
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
          description: engineer_set_id называет набор default.
        "500":
          $ref: "./common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"
          description: Недоступна база данных. Набор не удалён.

  /api/v1/engineers:
    get:
      operationId: list_engineers
      summary: Бригады региона или одного набора бригад
      description: >-
        Бригады только выбранного региона, по возрастанию id. Без
        engineer_set_id — бригады набора `default`; с engineer_set_id —
        бригады этого набора, если он принадлежит региону. id бригады не
        меняется при повторной загрузке данных региона. Регион без загруженных
        данных — пустой список.
      parameters:
        - $ref: "#/components/parameters/RegionQuery"
        - $ref: "#/components/parameters/EngineerSetIdQuery"
      responses:
        "200":
          description: Бригады региона или набора
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Engineer"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
          description: >-
            region не из конфигурации или не передан, либо engineer_set_id не
            из этого региона (`fields`).
        "500":
          $ref: "./common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"
          description: Недоступна база данных.

  /api/v1/tickets:
    get:
      operationId: list_tickets
      summary: Заявки региона
      description: >-
        Все заявки только выбранного региона, в любом статусе, по возрастанию
        id, без постраничной выдачи: в регионе не больше 500 заявок — предел
        загружаемого файла. Регион без загруженных данных — пустой список.
        Назначения заявок бригадам — в плане, а не здесь.
      parameters:
        - $ref: "#/components/parameters/RegionQuery"
      responses:
        "200":
          description: Заявки региона
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "500":
          $ref: "./common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"
          description: Недоступна база данных.

  /api/v1/tickets/{ticket_id}/status:
    patch:
      operationId: change_ticket_status
      summary: Изменить статус заявки
      description: >-
        Диспетчер отмечает ход заявки по сообщению бригады. Статусы идут по
        цепочке not_sent → sent → en_route → in_progress → completed; переход
        вперёд по цепочке допустим и через шаг (из sent сразу в completed).
        cancelled — из любого незакрытого статуса. overdue — из not_sent, sent
        и en_route; из overdue — в en_route, in_progress, completed или
        cancelled. completed и cancelled — закрытые статусы: из них переходов
        нет, и закрытая заявка не участвует в последующих перепланированиях.
        Любой другой переход, в том числе назад по цепочке, — ошибка 400 с
        message; статус заявки при этом не меняется. Запрос со статусом,
        который у заявки уже есть, ничего не меняет и отвечает 200 — повтор
        запроса безопасен. Отмена после выезда бригады (из en_route или
        in_progress) отмечается у заявки: выезд уже потрачен и учитывается в
        метриках плана. Уже построенные планы запрос не меняет.
      parameters:
        - name: ticket_id
          in: path
          required: true
          description: Идентификатор заявки на сервере
          schema:
            type: integer
            minimum: 1
            maximum: 9223372036854775807
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketStatusChange"
      responses:
        "200":
          description: Заявка с новым статусом
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
          description: Заявки с таким ticket_id нет.
        "413":
          $ref: "./common.yaml#/components/responses/PayloadTooLarge"
        "500":
          $ref: "./common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"
          description: Недоступна база данных. Статус заявки не изменился.

  /api/v1/plan/build:
    post:
      operationId: build_plan
      summary: Поставить построение плана выездов региона на дату в очередь
      description: >-
        Ставит построение плана в очередь и отвечает не дожидаясь его конца:
        назначение открытых (не completed и не cancelled) заявок региона на
        дату plan_date бригадам региона — основным алгоритмом (RoutingModel,
        трёхфазная лексикографическая оптимизация) или независимым baseline
        (FCFS, для сравнения) — и атрибуция причин отказа идут в фоне после
        ответа. Клиент получает plan_id сразу и узнаёт результат, опрашивая
        `GET /plan/{plan_id}`, пока status не станет done или failed. Каждый
        вызов — новый план (новый plan_id); построение не заменяет и не
        удаляет более ранние планы того же региона и даты.


        Регион должен иметь загруженные данные (`POST /data/upload` или
        `POST /data/demo`) — иначе 400. Каждая открытая заявка региона должна
        приходиться на дату plan_date (окно заявки — из файла одной загрузки,
        все заявки на один день) — несовпадение хотя бы одной заявки отклоняет
        весь запрос 400, план не ставится в очередь.


        `engineer_set_id` выбирает, по какому набору бригад региона строить
        план (без него — набор default); план хранит свой набор, и
        перепланирование этого плана идёт по бригадам того же набора.


        Число точек будущей маршрутной матрицы (бригады + заявки) проверяется
        до постановки в очередь — больше предела OSRM отклоняет запрос 400.
        Время в пути и расстояние считаются по дорожному графу (OSRM) уже в
        фоне, отдельно для каждого типа транспорта бригад региона. Основной
        алгоритм выполняется в одном процессе на весь сервер — конкурентное
        построение встаёт в очередь исполнителя, а не запускается параллельно
        вторым процессом.


        Плановое прибытие — расчётное время в пути от предыдущей точки
        маршрута (или от точки старта бригады) плюс текущее время; норматив
        «дорога 20 минут» здесь не используется. Причина каждой неназначенной
        заявки определяется процедурой атрибуции (навык → транспорт →
        окно/смена → «все подходящие бригады заняты»), а не первой
        проваленной проверкой.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanBuildRequest"
      responses:
        "202":
          description: План поставлен в очередь (status = running), маршрутов ещё нет
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
          description: >-
            Регион не из конфигурации, у региона нет загруженных данных, окно
            хотя бы одной открытой заявки региона не на дату plan_date, либо
            число точек маршрутной матрицы больше предела OSRM.
        "413":
          $ref: "./common.yaml#/components/responses/PayloadTooLarge"
        "500":
          $ref: "./common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"
          description: >-
            Недоступна база данных при постановке плана в очередь. План не
            создан.

  /api/v1/plan/{plan_id}:
    get:
      operationId: get_plan
      summary: Получить план — построенный, ещё считающийся или не сложившийся
      description: >-
        Возвращает план в любом из трёх состояний status без обращения к OSRM
        или солверу: running — план поставлен в очередь, маршрутов ещё нет;
        done — маршруты, объяснения и причины неназначенных заявок читаются
        из сохранённых данных построения; failed — построение не закончилось,
        причина — в failed_reason. Клиент опрашивает эту операцию, пока
        status не перестанет быть running.
      parameters:
        - name: plan_id
          in: path
          required: true
          description: Идентификатор плана на сервере
          schema:
            type: integer
            minimum: 1
            maximum: 9223372036854775807
      responses:
        "200":
          description: План в состоянии running, done или failed
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
          description: plan_id вне допустимого диапазона.
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
          description: Плана с таким plan_id нет.
        "500":
          $ref: "./common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"
          description: Недоступна база данных.

  /api/v1/plan/{plan_id}/compare:
    get:
      operationId: compare_plan
      summary: Сравнить обязательные метрики плана с baseline-планом
      description: >-
        Сравнивает план из пути запроса (обычно `algorithm=or_tools`) с
        baseline-планом (`baseline_plan_id`, обычно `algorithm=baseline_fcfs`)
        по обязательным метрикам (`engineers_used`, `total_distance_km`) —
        по одной записи на каждую. Оба плана должны быть в состоянии
        `status=done`: метрики строящегося или не сложившегося плана не
        определены. Оба плана должны быть одного набора бригад
        (`engineer_set_id`) — иначе сравнение бессмысленно: у планов разных
        наборов разное число бригад. `idle_time` в сравнение не входит — она
        только для отображения (см. `PlanMetrics.idle_time_by_engineer_min`).
      parameters:
        - name: plan_id
          in: path
          required: true
          description: Идентификатор плана на сервере
          schema:
            type: integer
            minimum: 1
            maximum: 9223372036854775807
        - name: baseline_plan_id
          in: query
          required: true
          description: Идентификатор baseline-плана, с которым сравнивается plan_id
          schema:
            type: integer
            minimum: 1
            maximum: 9223372036854775807
      responses:
        "200":
          description: Сравнение по каждой обязательной метрике, в порядке engineers_used, total_distance_km
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanComparisonEntry"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
          description: >-
            plan_id или baseline_plan_id вне допустимого диапазона (`fields`),
            либо один из двух планов ещё не done или у планов разные
            engineer_set_id (`message`).
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
          description: Плана с таким plan_id или baseline_plan_id нет.
        "500":
          $ref: "./common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"
          description: Недоступна база данных.

  /api/v1/plan/{plan_id}/replan:
    post:
      operationId: replan_plan
      summary: Перепланировать бригады по одному событию дня
      description: >-
        Синхронно пересчитывает часть плана-родителя (`plan_id`) по одному
        событию перепланирования (Contract Net: объявление задания
        бригадам-кандидатам, локальные ставки, победитель с минимальной
        ставкой) и сохраняет результат новым планом с `parent_plan_id =
        plan_id`. Новый план наследует `engineer_set_id` плана-родителя —
        перепланирование пересчитывает бригады того же набора, набор сменить
        нельзя. План-родитель должен быть в состоянии `status=done` —
        иначе `400`. Пересчёт идёт от состояния бригад на момент
        `triggered_at` события: заявки `completed`/`cancelled` исключены,
        `in_progress` зафиксирована (бригада освобождается не раньше
        планового окончания этой заявки, начатая работа не прерывается),
        `en_route` и ещё не начатые заявки можно переставить. Затрагиваются
        только маршруты бригад, на которые повлияло событие — план остальных
        бригад переносится без изменений. Ответ несёт блок `diff` — что
        именно изменилось относительно `plan_id`.


        `new_urgent_ticket` — новая аварийная заявка. Кандидаты — бригады с
        навыком `emergency`; побеждает ставка с минимальным временем
        прибытия среди успевающих к `triggered_at + reaction_min` (60–120,
        по умолчанию 120), иначе — минимальное время прибытия среди всех
        кандидатов (превышение реакции отражается в `explanation` визита).
        Сначала — вставка в маршрут победителя без нарушения окон уже
        стоящих там заявок; если это невозможно — вытесняется одна не
        начатая заявка победителя более низкого приоритета, которая
        повторно торгуется среди остальных бригад без нарушения её
        собственного окна (каскад глубиной 1 — второе вытеснение не
        выполняется, вытесненная заявка, которую не удалось пристроить,
        уходит в `unassigned`). Если ни одна бригада не обладает навыком
        `emergency` — заявка уходит в `unassigned`. Заявке сервер сам
        присваивает `required_skill=emergency`, `priority=1`,
        `duration_min=80` (время на объекте), `received_at = triggered_at` и
        окно `[triggered_at, конец даты плана]` — окно здесь не сужает выбор
        бригады, целевое время реакции задаёт только `reaction_min`.


        `new_ticket` — новая обычная заявка в течение дня (необязательная
        возможность): только вставка в свободный интервал маршрута
        бригады-кандидата, без объявления задания и без вытеснения.
        `required_skill`, `priority` и `duration_min` определяются парой
        (`type_bk`, `type_hd`) по той же таблице соответствия типов, что и
        при загрузке файла — неизвестная пара типов отклоняется `400` ещё до
        поиска бригады. Кандидаты — бригады с этим навыком (и транспортом,
        если задан); среди их фактических маршрутов ищется свободный
        интервал, где прибытие на новую заявку попадает в её окно и не
        отодвигает ни один уже стоящий визит бригады; побеждает интервал с
        минимальным временем прибытия. Не найдено ни одного интервала —
        заявка уходит в `unassigned`, план остальных бригад не меняется.


        `ticket_cancelled` — заявка уже отменена (`PATCH
        /tickets/{ticket_id}/status`, `status=cancelled`) и убирается из
        маршрута бригады, на которую была назначена; последующие визиты этой
        бригады сдвигаются по времени; остальные бригады не пересчитываются.


        `engineer_unavailable` — бригада стала недоступна. С её маршрута
        снимаются все ещё не начатые визиты (`en_route` и позже не начатые;
        визит `in_progress` — как и у остальных событий — зафиксирован).
        Для каждой снятой заявки ищется свободный интервал в маршруте другой
        бригады региона — так же, как у `new_ticket`: без объявления задания
        и без вытеснения, побеждает интервал с минимальным временем прибытия.
        Не нашлось интервала ни у одной бригады — заявка уходит в
        `unassigned`. Сама ставшая недоступной бригада остаётся в ответе без
        визитов; последующие события снова могут назначать ей заявки.
      parameters:
        - name: plan_id
          in: path
          required: true
          description: Идентификатор плана-родителя на сервере
          schema:
            type: integer
            minimum: 1
            maximum: 9223372036854775807
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplanEventRequest"
      responses:
        "200":
          description: Новый план с diff относительно plan_id
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanReplanResult"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
          description: >-
            Событие не проходит ограничения контракта (`fields`), либо
            plan_id ещё не done, либо triggered_at раньше начала или позже
            конца даты плана, либо (`new_ticket`) window_start не раньше
            window_end, окно не приходится на дату плана, или пара
            (type_bk, type_hd) не найдена в таблице соответствия типов
            (`message`).
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
          description: >-
            Плана с таким plan_id нет, либо (для ticket_cancelled) заявки с
            таким ticket_id нет, либо (для engineer_unavailable) бригады с
            таким engineer_id нет.
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
          description: (ticket_cancelled) заявка ещё не в статусе cancelled.
        "500":
          $ref: "./common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"
          description: Недоступны OSRM или база данных.

components:
  parameters:
    RegionQuery:
      name: region
      in: query
      required: true
      description: >-
        Код региона из списка регионов. Код, которого нет в конфигурации
        сервера, — ошибка 400 у параметра region.
      schema:
        $ref: "#/components/schemas/RegionCode"
    EngineerSetIdQuery:
      name: engineer_set_id
      in: query
      required: false
      description: >-
        Набор бригад региона. Без параметра — набор default. Набор, которого
        нет или который принадлежит другому региону, — ошибка 400 у параметра
        engineer_set_id.
      schema:
        type: integer
        minimum: 1
        maximum: 9223372036854775807
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
          description: Статус процесса; поле присутствует со значением "ok" в любом полученном ответе
        version:
          type: string
          description: Версия приложения из метаданных пакета (совпадает с info.version)

    RegionCode:
      type: string
      minLength: 1
      maxLength: 50
      pattern: "^[a-z][a-z0-9_]*$"
      description: Код региона — латиница в нижнем регистре, цифры и «_»; начинается с буквы
      examples: ["east"]

    Region:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          $ref: "#/components/schemas/RegionCode"
        name:
          type: string
          description: Название региона для показа пользователю

    Point:
      type: object
      additionalProperties: false
      required: [lat, lon]
      description: Точка WGS84 (EPSG:4326), градусы
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
          description: Широта, градусы
        lon:
          type: number
          minimum: -180
          maximum: 180
          description: Долгота, градусы

    Skill:
      type: string
      enum: [local_work, connection, emergency]
      description: >-
        Навык: local_work — локальные работы, connection — подключения и
        дозаказы, emergency — аварийные работы

    VehicleType:
      type: string
      enum: [car, foot, bike, public_transport]
      description: Транспорт бригады — определяет профиль маршрута по дорожному графу

    TicketStatus:
      type: string
      enum: [not_sent, sent, en_route, in_progress, completed, cancelled, overdue]
      description: Статус заявки

    Engineer:
      type: object
      additionalProperties: false
      required: [id, name, vehicle_type, skills, shift_start, shift_end, start]
      properties:
        id:
          type: integer
          description: Идентификатор бригады
        name:
          type: string
          description: Название бригады
        vehicle_type:
          $ref: "#/components/schemas/VehicleType"
        skills:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Skill"
          description: Навыки бригады, от одного до трёх
        shift_start:
          $ref: "./common.yaml#/components/schemas/LocalTime"
        shift_end:
          $ref: "./common.yaml#/components/schemas/LocalTime"
        start:
          $ref: "#/components/schemas/Point"

    Ticket:
      type: object
      additionalProperties: false
      required:
        - id
        - external_id
        - type_bk
        - type_hd
        - required_skill
        - required_vehicle
        - priority
        - district
        - address
        - location
        - window_start
        - window_end
        - duration_min
        - status
        - received_at
      properties:
        id:
          type: integer
          description: Идентификатор заявки на сервере
        external_id:
          type: string
          description: Номер заявки из файла (колонка «Заявка»); не уникален
        type_bk:
          type: [string, "null"]
          description: Тип заявки BK из файла; null, если колонки или значения нет
        type_hd:
          type: string
          description: Тип заявки HD из файла
        required_skill:
          $ref: "#/components/schemas/Skill"
        required_vehicle:
          description: Транспорт, который требует заявка; null — подходит любой
          anyOf:
            - $ref: "#/components/schemas/VehicleType"
            - type: "null"
        priority:
          type: integer
          minimum: 1
          description: >-
            Ранг приоритета, меньше — срочнее: 1 — авария, 2 — подключение,
            3 — ремонт и дозаказ
        district:
          type: [string, "null"]
          description: Район из файла; null, если не указан
        address:
          type: string
          description: Адрес из файла
        location:
          $ref: "#/components/schemas/Point"
        window_start:
          $ref: "./common.yaml#/components/schemas/LocalDateTime"
        window_end:
          $ref: "./common.yaml#/components/schemas/LocalDateTime"
        duration_min:
          type: integer
          minimum: 1
          description: Время работы на объекте, минуты
        status:
          $ref: "#/components/schemas/TicketStatus"
        received_at:
          $ref: "./common.yaml#/components/schemas/LocalDateTime"

    TicketStatusChange:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/TicketStatus"
          description: >-
            Новый статус заявки; допустимые переходы — в описании операции
            change_ticket_status

    DemoDataRequest:
      type: object
      additionalProperties: false
      required: [region]
      properties:
        region:
          $ref: "#/components/schemas/RegionCode"

    RegionDataUpload:
      type: object
      additionalProperties: false
      required: [region, tickets_file]
      properties:
        region:
          $ref: "#/components/schemas/RegionCode"
        tickets_file:
          type: string
          format: binary
          description: >-
            Файл заявок, .csv или .json; формат и пределы — в описании операции

    InvalidRow:
      type: object
      additionalProperties: false
      required: [row, reason, column]
      properties:
        row:
          type: integer
          minimum: 1
          description: >-
            Номер строки: для CSV — строка файла (заголовок — строка 1), для
            JSON — позиция элемента массива, с 1
        reason:
          type: string
          enum:
            - missing_field
            - field_too_long
            - bad_datetime
            - window_order
            - unknown_type
            - unknown_status
            - address_not_found
          description: >-
            Почему строка не загружена: missing_field — нет обязательного поля;
            field_too_long — поле длиннее предела (адрес — 300 символов,
            остальные — 200); bad_datetime — время не в формате ДД.ММ.ГГГГ Ч:ММ;
            window_order — начало окна не раньше окончания; unknown_type — тип
            заявки не из таблицы соответствия; unknown_status — «Статус BK» не
            из таблицы соответствия; address_not_found — для адреса не нашлось
            координат
        column:
          type: [string, "null"]
          description: >-
            Колонка файла, к которой относится ошибка, как в заголовке; null,
            если ошибка не относится к одной колонке

    DataLoadResult:
      type: object
      additionalProperties: false
      required: [region, engineers, tickets, rows_total, rows_skipped, rows_invalid]
      properties:
        region:
          $ref: "#/components/schemas/RegionCode"
        engineers:
          type: integer
          minimum: 0
          description: Сколько бригад теперь во всех наборах региона вместе
        tickets:
          type: integer
          minimum: 1
          description: Сколько заявок загружено
        rows_total:
          type: integer
          minimum: 0
          description: Строк данных в файле, без заголовка CSV
        rows_skipped:
          type: integer
          minimum: 0
          description: Пропущено строк, которые не заявки — пустых и служебной строки адреса офиса
        rows_invalid:
          type: array
          items:
            $ref: "#/components/schemas/InvalidRow"
          description: Строки-заявки, которые не загружены, по возрастанию номера строки

    EngineerSetKind:
      type: string
      enum: [demo, generated]
      description: >-
        demo — набор default, создаётся первой загрузкой данных региона и
        обновляется вместе с ней (как сегодняшние бригады региона); удалить
        нельзя. generated — дополнительный набор, создан POST /engineer-sets.

    EngineerSet:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - kind
        - engineers
        - morning_share
        - evening_share
        - seed
        - description
      properties:
        id:
          type: integer
          description: Идентификатор набора бригад на сервере
        name:
          type: string
          description: >-
            Название набора, уникальное в регионе; у набора kind=demo всегда
            "default"
        kind:
          $ref: "#/components/schemas/EngineerSetKind"
        engineers:
          type: integer
          minimum: 1
          maximum: 30
          description: Сколько бригад в наборе
        morning_share:
          type: number
          minimum: 0
          maximum: 1
          description: Доля бригад на утренней смене, которой создан набор
        evening_share:
          type: number
          minimum: 0
          maximum: 1
          description: Доля бригад на вечерней смене, которой создан набор
        seed:
          type: string
          description: Зерно генератора, которым создан набор
        description:
          type: string
          description: >-
            Параметры генератора набора текстом для пользователя (число
            бригад, доли смен, seed) — чтобы отличить наборы одного региона
            друг от друга на фронтенде

    EngineerSetCreateRequest:
      type: object
      additionalProperties: false
      required: [region, name, engineers, morning_share, evening_share, seed]
      properties:
        region:
          $ref: "#/components/schemas/RegionCode"
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            Название набора, уникальное в регионе; "default" занято набором
            региона, если регион загружен
        engineers:
          type: integer
          minimum: 1
          maximum: 30
          description: Сколько бригад создать
        morning_share:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            Доля бригад на утренней смене (округляется вниз); вместе с
            evening_share не должна оставлять меньше 4 бригад на весь день
        evening_share:
          type: number
          minimum: 0
          maximum: 1
          description: Доля бригад на вечерней смене (округляется вниз)
        seed:
          type: string
          minLength: 1
          maxLength: 50
          description: Зерно генератора; тот же seed и те же остальные параметры дают тот же набор

    PlanAlgorithm:
      type: string
      enum: [or_tools, baseline_fcfs]
      description: >-
        Чем строится план: or_tools — основной алгоритм (RoutingModel,
        трёхфазная лексикографическая оптимизация), baseline_fcfs — независимый
        план для сравнения (назначение по порядку поступления заявок)

    PlanBuildRequest:
      type: object
      additionalProperties: false
      required: [region, plan_date, algorithm]
      properties:
        region:
          $ref: "#/components/schemas/RegionCode"
        plan_date:
          $ref: "./common.yaml#/components/schemas/LocalDate"
          description: >-
            Дата плана; окно каждой открытой заявки региона должно приходиться
            на эту дату
        algorithm:
          $ref: "#/components/schemas/PlanAlgorithm"
        engineer_set_id:
          type: [integer, "null"]
          minimum: 1
          maximum: 9223372036854775807
          default: null
          description: >-
            Набор бригад региона, для которого строится план; null или
            отсутствует — набор default. Набор, которого нет или который
            принадлежит другому региону, — ошибка 400 у поля engineer_set_id

    UnassignedReason:
      type: string
      enum:
        - no_skill
        - no_vehicle
        - no_time_slot
        - shift_overflow
        - all_eligible_engineers_booked_elsewhere
      description: >-
        Причина, по которой заявка не назначена ни одной бригаде: no_skill —
        нет бригады с нужным навыком; no_vehicle — нет бригады с нужным
        транспортом; no_time_slot — ни одна подходящая по навыку и транспорту
        бригада не успевает в окно заявки без нарушения своих ограничений;
        shift_overflow — назначение вывело бы бригаду за пределы смены;
        all_eligible_engineers_booked_elsewhere — подходящая бригада есть, но
        все такие бригады заняты другими заявками

    Visit:
      type: object
      additionalProperties: false
      required:
        - ticket_id
        - sequence_no
        - planned_arrival
        - travel_time_min
        - travel_distance_km
        - explanation
      properties:
        ticket_id:
          type: integer
          description: Заявка визита
        sequence_no:
          type: integer
          minimum: 1
          description: Порядковый номер визита в маршруте бригады, с 1
        planned_arrival:
          $ref: "./common.yaml#/components/schemas/LocalDateTime"
          description: >-
            Плановое прибытие; может быть раньше начала окна заявки — бригада
            ждёт открытия окна
        travel_time_min:
          type: integer
          minimum: 0
          description: >-
            Время в пути до визита от предыдущей точки маршрута (или от точки
            старта бригады для первого визита), минуты, с округлением вверх
        travel_distance_km:
          type: number
          minimum: 0
          description: >-
            Расстояние до визита от предыдущей точки маршрута, километры, с
            округлением до 0.1 км
        explanation:
          type: string
          description: Текст для пользователя, почему заявка назначена этой бригаде

    EngineerRoute:
      type: object
      additionalProperties: false
      required:
        - engineer_id
        - name
        - route
        - total_distance_km
        - total_travel_time_min
        - idle_time_min
      properties:
        engineer_id:
          type: integer
          description: Бригада маршрута
        name:
          type: string
          description: Название бригады
        route:
          type: array
          items:
            $ref: "#/components/schemas/Visit"
          description: Визиты бригады по возрастанию sequence_no; пустой массив — бригада не задействована
        total_distance_km:
          type: number
          minimum: 0
          description: Суммарное расстояние маршрута, километры
        total_travel_time_min:
          type: integer
          minimum: 0
          description: Суммарное время в пути маршрута, минуты
        idle_time_min:
          type: integer
          minimum: 0
          description: >-
            Простой бригады: длина смены минус суммарное время визитов и
            переездов; только для отображения — не входит в целевую функцию
            построения плана

    UnassignedTicket:
      type: object
      additionalProperties: false
      required: [ticket_id, reason_code, explanation]
      properties:
        ticket_id:
          type: integer
          description: Неназначенная заявка
        reason_code:
          $ref: "#/components/schemas/UnassignedReason"
        explanation:
          type: string
          description: Текст для пользователя, почему заявка не назначена

    PlanStatus:
      type: string
      enum: [running, done, failed]
      description: >-
        running — план поставлен в очередь и считается фоновой задачей, маршрутов ещё нет;
        done — расчёт закончен успешно, engineers/unassigned заполнены; failed — расчёт не
        закончился (OSRM/БД недоступны, расчёт завис дольше отведённого времени или прерван
        остановкой сервера), см. failed_reason

    PlanFailedReason:
      type: string
      enum: [osrm_unavailable, db_unavailable, build_error, timeout, shutdown]
      description: >-
        Причина отказа уже поставленного в очередь построения: osrm_unavailable — сервис
        маршрутов недоступен, db_unavailable — недоступна база данных при сохранении плана,
        build_error — непредусмотренная ошибка построения, timeout — расчёт не уложился в
        отведённое время и был принудительно прерван, shutdown — план остался в running на
        момент остановки сервера и был закрыт при следующем запуске

    PlanMetrics:
      type: object
      additionalProperties: false
      required:
        - engineers_used
        - total_distance_km
        - distance_by_engineer
        - assigned_count
        - unassigned_count
        - idle_time_by_engineer_min
      properties:
        engineers_used:
          type: integer
          minimum: 0
          description: Число бригад региона хотя бы с одним визитом в плане
        total_distance_km:
          type: number
          minimum: 0
          description: Суммарное расстояние всех маршрутов плана, километры
        distance_by_engineer:
          type: object
          additionalProperties:
            type: number
            minimum: 0
          description: >-
            Расстояние маршрута каждой бригады региона (ключ — engineer_id
            строкой), километры; 0 у бригады без визитов
        assigned_count:
          type: integer
          minimum: 0
          description: Число назначенных заявок плана
        unassigned_count:
          type: integer
          minimum: 0
          description: Число неназначенных заявок плана
        idle_time_by_engineer_min:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          description: >-
            Простой каждой бригады региона (ключ — engineer_id строкой), минуты;
            то же значение, что и `EngineerRoute.idle_time_min`, только для отображения —
            не входит ни в целевую функцию построения плана, ни в сравнение
            (`GET /plan/{plan_id}/compare`)

    PlanComparisonMetric:
      type: string
      enum: [engineers_used, total_distance_km]
      description: >-
        Обязательная метрика, участвующая в сравнении плана с baseline;
        idle_time не сравнивается (метрика только для отображения)

    PlanComparisonEntry:
      type: object
      additionalProperties: false
      required: [metric, main, baseline, delta]
      properties:
        metric:
          $ref: "#/components/schemas/PlanComparisonMetric"
        main:
          type: number
          description: Значение метрики у плана из пути запроса
        baseline:
          type: number
          description: Значение той же метрики у baseline-плана
        delta:
          type: number
          description: main минус baseline; отрицательное значение — план лучше baseline

    Plan:
      type: object
      additionalProperties: false
      required: [plan_id, algorithm, status, engineer_set_id]
      properties:
        plan_id:
          type: integer
          description: Идентификатор плана на сервере
        algorithm:
          $ref: "#/components/schemas/PlanAlgorithm"
        status:
          $ref: "#/components/schemas/PlanStatus"
        engineer_set_id:
          type: integer
          description: >-
            Набор бригад, для которого построен план — тот же, что был передан
            (или default) в POST /plan/build, каким бы ни был status
        engineers:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/EngineerRoute"
            - type: "null"
          description: >-
            Маршруты всех бригад региона на дату плана, по возрастанию engineer_id;
            null, если status не done
        unassigned:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/UnassignedTicket"
            - type: "null"
          description: >-
            Неназначенные заявки, по возрастанию ticket_id; null, если status не done
        metrics:
          anyOf:
            - $ref: "#/components/schemas/PlanMetrics"
            - type: "null"
          description: Обязательные метрики плана; null, если status не done
        failed_reason:
          anyOf:
            - $ref: "#/components/schemas/PlanFailedReason"
            - type: "null"
          description: Причина отказа; null, если status не failed

    IncidentTicketInput:
      type: object
      additionalProperties: false
      required: [external_id, type_bk, type_hd, district, address, location, required_vehicle]
      properties:
        external_id:
          type: string
          maxLength: 200
          description: Номер заявки во внешней системе (HD/BK); не уникален
        type_bk:
          type: [string, "null"]
          maxLength: 200
          description: Тип заявки BK, если известен диспетчеру; null, если нет
        type_hd:
          type: string
          maxLength: 200
          description: >-
            Тип заявки HD — информационное поле; required_skill=emergency
            присваивается событием new_urgent_ticket, а не этим полем
        district:
          type: [string, "null"]
          maxLength: 200
          description: Район; null, если не указан
        address:
          type: string
          maxLength: 300
          description: Адрес аварии
        location:
          $ref: "#/components/schemas/Point"
        required_vehicle:
          description: Транспорт, который требует заявка; null — подходит любой
          anyOf:
            - $ref: "#/components/schemas/VehicleType"
            - type: "null"

    RegularTicketInput:
      type: object
      additionalProperties: false
      required:
        - external_id
        - type_bk
        - type_hd
        - district
        - address
        - location
        - required_vehicle
        - window_start
        - window_end
      properties:
        external_id:
          type: string
          maxLength: 200
          description: Номер заявки во внешней системе (HD/BK); не уникален
        type_bk:
          type: [string, "null"]
          maxLength: 200
          description: Тип заявки BK; вместе с type_hd определяет required_skill/priority/duration_min
        type_hd:
          type: string
          maxLength: 200
          description: Тип заявки HD; вместе с type_bk определяет required_skill/priority/duration_min
        district:
          type: [string, "null"]
          maxLength: 200
          description: Район; null, если не указан
        address:
          type: string
          maxLength: 300
          description: Адрес выезда
        location:
          $ref: "#/components/schemas/Point"
        required_vehicle:
          description: Транспорт, который требует заявка; null — подходит любой
          anyOf:
            - $ref: "#/components/schemas/VehicleType"
            - type: "null"
        window_start:
          $ref: "./common.yaml#/components/schemas/LocalDateTime"
          description: Начало окна, в которое бригада должна прибыть
        window_end:
          $ref: "./common.yaml#/components/schemas/LocalDateTime"
          description: Конец окна прибытия; строго позже начала

    NewTicketEvent:
      type: object
      additionalProperties: false
      required: [event_type, triggered_at, ticket]
      properties:
        event_type:
          type: string
          enum: [new_ticket]
          description: Тип события — новая обычная заявка, поступившая в течение дня
        triggered_at:
          $ref: "./common.yaml#/components/schemas/LocalDateTime"
          description: >-
            Момент поступления заявки; план перестраивается от состояния
            бригад на этот момент
        ticket:
          $ref: "#/components/schemas/RegularTicketInput"

    NewUrgentTicketEvent:
      type: object
      additionalProperties: false
      required: [event_type, triggered_at, ticket]
      properties:
        event_type:
          type: string
          enum: [new_urgent_ticket]
          description: Тип события — новая аварийная заявка
        triggered_at:
          $ref: "./common.yaml#/components/schemas/LocalDateTime"
          description: >-
            Момент, когда авария зафиксирована; план перестраивается от
            состояния бригад на этот момент
        ticket:
          $ref: "#/components/schemas/IncidentTicketInput"
        reaction_min:
          type: integer
          minimum: 60
          maximum: 120
          default: 120
          description: >-
            Целевое время реакции от triggered_at до прибытия бригады;
            необязательное поле, по умолчанию 120

    TicketCancelledEvent:
      type: object
      additionalProperties: false
      required: [event_type, triggered_at, ticket_id]
      properties:
        event_type:
          type: string
          enum: [ticket_cancelled]
          description: Тип события — заявка отменена
        triggered_at:
          $ref: "./common.yaml#/components/schemas/LocalDateTime"
          description: Момент отмены; определяет состояние бригад на пересчёте
        ticket_id:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
          description: Отменённая заявка (status=cancelled)

    EngineerUnavailableEvent:
      type: object
      additionalProperties: false
      required: [event_type, triggered_at, engineer_id]
      properties:
        event_type:
          type: string
          enum: [engineer_unavailable]
          description: Тип события — бригада стала недоступна
        triggered_at:
          $ref: "./common.yaml#/components/schemas/LocalDateTime"
          description: >-
            Момент, когда бригада стала недоступна; план перестраивается от
            состояния бригад на этот момент
        engineer_id:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
          description: Бригада, ставшая недоступной

    ReplanEventRequest:
      description: Одно событие перепланирования; тип определяет event_type.
      oneOf:
        - $ref: "#/components/schemas/NewUrgentTicketEvent"
        - $ref: "#/components/schemas/NewTicketEvent"
        - $ref: "#/components/schemas/TicketCancelledEvent"
        - $ref: "#/components/schemas/EngineerUnavailableEvent"

    AssignmentChange:
      type: object
      additionalProperties: false
      required:
        - ticket_id
        - before_engineer_id
        - after_engineer_id
        - before_sequence_no
        - after_sequence_no
      properties:
        ticket_id:
          type: integer
          description: Заявка, чьё назначение изменилось
        before_engineer_id:
          type: integer
          description: Бригада заявки в plan_id
        after_engineer_id:
          type: integer
          description: Бригада заявки в новом плане
        before_sequence_no:
          type: integer
          minimum: 1
          description: Порядковый номер визита в plan_id
        after_sequence_no:
          type: integer
          minimum: 1
          description: Порядковый номер визита в новом плане

    PlanDiff:
      type: object
      additionalProperties: false
      required:
        - changed_assignments
        - newly_assigned
        - newly_unassigned
        - reassigned_from_unavailable_engineer
        - plan_stability
      properties:
        changed_assignments:
          type: array
          items:
            $ref: "#/components/schemas/AssignmentChange"
          description: Заявки, у которых сменилась бригада и/или порядковый номер визита
        newly_assigned:
          type: array
          items:
            type: integer
          description: >-
            Заявки, назначенные впервые этим событием, по возрастанию ticket_id
        newly_unassigned:
          type: array
          items:
            type: integer
          description: >-
            Заявки, назначенные в plan_id, а этим событием ушедшие в
            unassigned, по возрастанию ticket_id
        reassigned_from_unavailable_engineer:
          type: array
          items:
            type: integer
          description: >-
            Заявки, переставленные с бригады, ставшей недоступной событием
            engineer_unavailable, на маршруты других бригад; для остальных
            типов событий — всегда пустое
        plan_stability:
          type: integer
          minimum: 0
          description: Число бригад, чей маршрут изменило это событие

    PlanReplanResult:
      type: object
      additionalProperties: false
      required:
        - plan_id
        - parent_plan_id
        - algorithm
        - status
        - engineer_set_id
        - engineers
        - unassigned
        - metrics
        - diff
      properties:
        plan_id:
          type: integer
          description: Идентификатор нового плана
        parent_plan_id:
          type: integer
          description: План, от которого посчитан этот, — plan_id из пути запроса
        algorithm:
          $ref: "#/components/schemas/PlanAlgorithm"
          description: Тот же алгоритм, что у plan_id
        engineer_set_id:
          type: integer
          description: Тот же набор бригад, что у plan_id — перепланирование не меняет набор
        status:
          type: string
          enum: [done]
          description: >-
            Перепланирование синхронное: ответ 200 всегда несёт готовый план
        engineers:
          type: array
          items:
            $ref: "#/components/schemas/EngineerRoute"
          description: Маршруты всех бригад региона на дату плана, по возрастанию engineer_id
        unassigned:
          type: array
          items:
            $ref: "#/components/schemas/UnassignedTicket"
          description: Неназначенные заявки, по возрастанию ticket_id
        metrics:
          $ref: "#/components/schemas/PlanMetrics"
        diff:
          $ref: "#/components/schemas/PlanDiff"
